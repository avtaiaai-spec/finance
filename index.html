<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#276A57" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="description"
      content="Спокойный и удобный учёт личных финансов. Данные остаются на вашем устройстве."
    />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <script>
      try {
        let d = JSON.parse(localStorage.getItem("calm-finance-v1") || "null");
        const appearance = JSON.parse(
          localStorage.getItem("calm-finance-appearance") || "null",
        );
        if (
          appearance &&
          ["light", "dark", "system"].includes(appearance.theme)
        )
          d = { settings: appearance };
        document.documentElement.dataset.palette = [
          "green",
          "pink",
          "yellow",
          "burgundy",
          "brown",
        ].includes(d?.settings?.palette)
          ? d.settings.palette
          : "green";
        document.documentElement.dataset.theme =
          (d?.settings?.theme || "system") === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : d.settings.theme;
      } catch {
        document.documentElement.dataset.theme = matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches
          ? "dark"
          : "light";
      }
    </script>
    <title>Мои финансы</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
